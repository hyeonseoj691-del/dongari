<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>사막의 멸종위기종</title>
    <style>
        /* 모바일 게임 앱 전용 스타일 */
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            width: 100%;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #2b2d42 0%, #8d99ae 100%);
            color: #222;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 10px 20px;
        }

        .app-shell {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 16px;
            padding: 18px 0 24px;
        }

        .page {
            width: 100%;
            background: rgba(255,255,255,0.95);
            border-radius: 28px;
            box-shadow: 0 18px 48px rgba(0,0,0,0.2);
            padding: 18px;
            box-sizing: border-box;
            animation: appear 0.4s ease-out;
        }

        .hidden { display: none !important; }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .title-large {
            font-size: 1.6rem;
            line-height: 1.2;
            margin: 0 0 6px;
            letter-spacing: -0.03em;
        }

        .subtitle {
            margin: 0;
            color: #555;
            font-size: 0.97rem;
            line-height: 1.5;
        }

        .stage-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            margin-top: 18px;
        }

        .stage-card,
        .primary-button,
        .nav-button {
            border: none;
            border-radius: 18px;
            background: linear-gradient(135deg, #6c5ce7 0%, #00b894 100%);
            color: #fff;
            min-height: 96px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(108,92,231,0.2);
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            width: 100%;
            display: inline-flex;
            align-items: center;
            gap: 14px;
            touch-action: manipulation;
        }

        .stage-card:active,
        .primary-button:active,
        .nav-button:active {
            transform: scale(0.98);
            opacity: 0.95;
        }

        .stage-card {
            padding: 16px 18px;
            min-height: 110px;
        }

        .stage-icon {
            width: 66px;
            height: 66px;
            border-radius: 20px;
            background: rgba(255,255,255,0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            flex-shrink: 0;
        }

        .stage-label {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
        }

        .stage-label strong {
            font-size: 1.1rem;
            line-height: 1.2;
        }

        .game-header {
            margin-bottom: 18px;
        }

        .score-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }

        .score-box {
            background: #f7f9fc;
            border-radius: 16px;
            padding: 12px 14px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.06);
            font-size: 0.95rem;
            color: #333;
        }

        .score-box span {
            display: block;
            margin-top: 6px;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .rhythm-area,
        .sequence-grid,
        .card-grid,
        .detail-card {
            width: 100%;
        }

        .note-container {
            position: relative;
            width: 100%;
            height: 310px;
            margin: 0 auto 12px;
            background: linear-gradient(180deg, #eef2ff 0%, #dfe7fd 100%);
            border-radius: 24px;
            overflow: hidden;
            border: 2px solid rgba(108,92,231,0.18);
        }

        .judge-line {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 92px;
            height: 3px;
            background: rgba(108,92,231,0.7);
            box-shadow: 0 0 14px rgba(108,92,231,0.25);
        }

        .note-row {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 40px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 0 8px 10px;
            box-sizing: border-box;
        }

        .lane-button {
            background: rgba(255,255,255,0.9);
            border: 2px solid rgba(108,92,231,0.16);
            border-radius: 18px;
            min-height: 68px;
            font-size: 1.1rem;
            color: #222;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            transition: transform 0.16s ease;
        }

        .lane-button.active {
            transform: scale(0.98);
            background: #8d99ae;
            color: #fff;
        }

        .note {
            position: absolute;
            width: calc(25% - 10px);
            height: 48px;
            background: linear-gradient(180deg, #ffd67d 0%, #ff8a65 100%);
            border-radius: 14px;
            box-shadow: 0 12px 22px rgba(255,138,101,0.28);
            left: 0;
            transform: translateX(0) translateY(-60px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            color: #3b2f2f;
            text-shadow: 0 1px 1px rgba(255,255,255,0.25);
        }

        .feedback {
            min-height: 28px;
            margin: 6px 0 10px;
            font-weight: 700;
            font-size: 1rem;
            color: #222;
            text-align: center;
        }

        .feedback.perfect { color: #16a085; }
        .feedback.good { color: #f39c12; }
        .feedback.miss { color: #c0392b; }

        .sequence-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .color-btn {
            min-height: 140px;
            border-radius: 24px;
            border: 3px solid rgba(255,255,255,0.75);
            box-shadow: 0 12px 24px rgba(0,0,0,0.12);
            color: #fff;
            font-size: 1.4rem;
            font-weight: 700;
            touch-action: manipulation;
            transition: transform 0.16s ease, filter 0.2s ease;
        }

        .color-btn:active,
        .color-btn.active {
            transform: scale(0.97);
            filter: brightness(1.08);
        }

        .color-btn:nth-child(1) { background: linear-gradient(145deg, #ff7675, #d63031); }
        .color-btn:nth-child(2) { background: linear-gradient(145deg, #74b9ff, #0984e3); }
        .color-btn:nth-child(3) { background: linear-gradient(145deg, #55efc4, #00b894); }
        .color-btn:nth-child(4) { background: linear-gradient(145deg, #ffeaa7, #fdcb6e); color: #2d3436; }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }

        .card {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            cursor: pointer;
            perspective: 900px;
            touch-action: manipulation;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.55s ease;
            transform-style: preserve-3d;
            border-radius: 18px;
            box-shadow: 0 10px 22px rgba(0,0,0,0.12);
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 18px;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.7rem;
        }

        .card-front {
            background: #f7f9fc;
            border: 2px solid #dfe6ee;
            color: #2d3436;
        }

        .card-back {
            background: linear-gradient(145deg, #6c5ce7, #00cec9);
            transform: rotateY(180deg);
            color: #fff;
        }

        .game-message {
            margin: 8px 0 16px;
            padding: 14px 16px;
            border-radius: 18px;
            background: #f4f6ff;
            color: #333;
            font-size: 0.98rem;
            line-height: 1.5;
        }

        .result-panel {
            background: #ffffff;
            border-radius: 24px;
            border: 1px solid rgba(108,92,231,0.12);
            padding: 16px;
            margin-top: 10px;
            text-align: center;
        }

        .result-panel strong {
            display: block;
            margin-top: 8px;
            font-size: 1.1rem;
        }

        .result-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 14px;
        }

        .detail-card {
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
            text-align: center;
            padding-bottom: 10px;
        }

        .detail-card img {
            width: 100%;
            border-radius: 22px;
            max-height: 300px;
            object-fit: cover;
            box-shadow: 0 18px 40px rgba(0,0,0,0.12);
        }

        .detail-card p {
            color: #4b4b4b;
            font-size: 0.99rem;
            line-height: 1.7;
            margin: 0;
        }

        @keyframes appear {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 420px) {
            .stage-card, .primary-button, .nav-button {
                min-height: 88px;
                padding: 14px;
            }

            .lane-button { min-height: 62px; font-size: 1rem; }
            .color-btn { min-height: 120px; font-size: 1.2rem; }
            .card-grid { gap: 8px; }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <section id="mainPage" class="page">
            <div class="top-bar">
                <div>
                    <h1 class="title-large">사막의 멸종위기종</h1>
                    <p class="subtitle">아이콘을 터치하고 미니게임을 클리어하면 종의 비밀을 확인할 수 있어요.</p>
                </div>
            </div>
            <div class="stage-grid">
                <button class="stage-card" onclick="startStage(0)">
                    <div class="stage-icon">🦊</div>
                    <div class="stage-label">
                        <strong>페넥여우</strong>
                        <span>리듬 게임으로 사막의 박자를 맞춰보세요.</span>
                    </div>
                </button>
                <button class="stage-card" onclick="startStage(1)">
                    <div class="stage-icon">🌵</div>
                    <div class="stage-label">
                        <strong>마밀라리아 선인장</strong>
                        <span>뒤집기 카드로 기억력을 테스트하세요.</span>
                    </div>
                </button>
                <button class="stage-card" onclick="startStage(2)">
                    <div class="stage-icon">🐪</div>
                    <div class="stage-label">
                        <strong>야생쌍봉낙타</strong>
                        <span>순서 기억 게임으로 집중력을 높이세요.</span>
                    </div>
                </button>
            </div>
        </section>

        <section id="gamePage" class="page hidden">
            <button class="nav-button" onclick="goHome()">← 스테이지 선택</button>
            <div class="game-header">
                <h2 class="title-large" id="gameTitle">미니게임</h2>
                <p class="subtitle" id="gameInstruction">터치로 조작하고 화면을 즐겨보세요.</p>
            </div>

            <!-- 리듬 게임 -->
            <div id="rhythmGame" class="game-screen hidden">
                <div class="score-row">
                    <div class="score-box">시간 <span id="rhythmTime">60</span>s</div>
                    <div class="score-box">점수 <span id="rhythmScore">0</span></div>
                    <div class="score-box">콤보 <span id="rhythmCombo">0</span></div>
                    <div class="score-box">힛 <span id="rhythmHits">0</span></div>
                </div>
                <div class="note-container" id="rhythmContainer">
                    <div class="judge-line"></div>
                    <div id="noteLayer"></div>
                </div>
                <div class="note-row">
                    <button class="lane-button" data-lane="0">1</button>
                    <button class="lane-button" data-lane="1">2</button>
                    <button class="lane-button" data-lane="2">3</button>
                    <button class="lane-button" data-lane="3">4</button>
                </div>
                <div class="feedback" id="rhythmFeedback"></div>
            </div>

            <!-- 카드 게임 -->
            <div id="memoryGame" class="game-screen hidden">
                <div class="score-row">
                    <div class="score-box">시간 <span id="memoryTime">00:00</span></div>
                    <div class="score-box">시도 <span id="memoryAttempts">0</span></div>
                    <div class="score-box">맞춤 <span id="memoryMatches">0</span></div>
                    <div class="score-box">랭크 <span id="memoryRank">-</span></div>
                </div>
                <div class="game-message">같은 카드를 찾기 위해 가장 빠르게 뒤집어 보세요.</div>
                <div id="cardGrid" class="card-grid"></div>
            </div>

            <!-- 순서 기억 게임 -->
            <div id="sequenceGame" class="game-screen hidden">
                <div class="score-row">
                    <div class="score-box">라운드 <span id="sequenceRound">0</span></div>
                    <div class="score-box">최고 <span id="sequenceBest">0</span></div>
                </div>
                <div class="game-message" id="sequenceMessage">시작 버튼을 눌러 순서를 확인하세요.</div>
                <div class="sequence-grid">
                    <button class="color-btn" data-index="0">빨강</button>
                    <button class="color-btn" data-index="1">파랑</button>
                    <button class="color-btn" data-index="2">초록</button>
                    <button class="color-btn" data-index="3">노랑</button>
                </div>
                <button class="primary-button" onclick="startSequence()">게임 시작</button>
            </div>

            <div id="gameResult" class="result-panel hidden">
                <div id="resultTitle" class="title-large"></div>
                <p id="resultDetail" class="subtitle"></p>
                <div class="result-buttons">
                    <button class="primary-button" onclick="restartCurrentGame()">다시 하기</button>
                    <button id="resultProceedBtn" class="primary-button hidden" onclick="showSpeciesDetail()">설명 보기</button>
                </div>
            </div>
        </section>

        <section id="detailPage" class="page hidden">
            <button class="nav-button" onclick="goHome()">← 메인으로</button>
            <div class="detail-card">
                <h2 class="title-large" id="speciesName"></h2>
                <img id="speciesImage" src="" alt="species image">
                <p id="speciesDescription"></p>
                <button class="primary-button" onclick="goHome()">다시 단계 선택</button>
            </div>
        </section>
    </div>

    <script>
        const speciesData = [
            {
                name: '페넥여우',
                image: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="%23ffbe76"/><stop offset="100%" stop-color="%23eb4d4b"/></linearGradient></defs><rect width="900" height="600" fill="%23fdebd3"/><circle cx="450" cy="320" r="180" fill="url(%23g)"/><circle cx="340" cy="230" r="42" fill="%23fff1c1"/><circle cx="565" cy="230" r="42" fill="%23fff1c1"/><path d="M330 300 Q450 380 570 300" fill="none" stroke="%2340351b" stroke-width="18" stroke-linecap="round"/><path d="M230 200 L180 120" stroke="%2340351b" stroke-width="28" stroke-linecap="round"/><path d="M670 200 L720 120" stroke="%2340351b" stroke-width="28" stroke-linecap="round"/><text x="50" y="560" font-family="Segoe UI" font-size="48" fill="%23333030">페넥여우</text></svg>',
                description: '작고 민첩한 페넥여우는 사하라 사막의 작은 사냥꾼입니다. 큰 귀로 체온을 조절하며 밤에 활동합니다. 서식지 감소와 불법 거래로 개체가 줄어들고 있어 보호가 필요합니다.'
            },
            {
                name: '마밀라리아 선인장',
                image: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="%2332d7a7"/><stop offset="100%" stop-color="%230b8e69"/></linearGradient></defs><rect width="900" height="600" fill="%23effaf3"/><ellipse cx="450" cy="360" rx="210" ry="260" fill="url(%23g)"/><ellipse cx="450" cy="160" rx="120" ry="140" fill="url(%23g)"/><path d="M410 160 L390 70" stroke="%232f5d49" stroke-width="18" stroke-linecap="round"/><path d="M490 160 L510 70" stroke="%232f5d49" stroke-width="18" stroke-linecap="round"/><text x="50" y="560" font-family="Segoe UI" font-size="48" fill="%23333030">마밀라리아 선인장</text></svg>',
                description: '마밀라리아 선인장은 멕시코 사막에서 자라는 작은 선인장입니다. 둥글고 단단한 몸에서 아름다운 꽃을 피우지만, 불법 채집과 토지 개발로 위기에 처했습니다.'
            },
            {
                name: '야생쌍봉낙타',
                image: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="%23f5d061"/><stop offset="100%" stop-color="%23d35400"/></linearGradient></defs><rect width="900" height="600" fill="%23f3e9d2"/><ellipse cx="480" cy="360" rx="220" ry="140" fill="url(%23g)"/><ellipse cx="330" cy="250" rx="90" ry="70" fill="url(%23g)"/><ellipse cx="620" cy="250" rx="90" ry="70" fill="url(%23g)"/><path d="M240 260 Q280 220 310 240" stroke="%233e2a0f" stroke-width="18" fill="none" stroke-linecap="round"/><path d="M400 220 Q450 180 500 220" stroke="%233e2a0f" stroke-width="18" fill="none" stroke-linecap="round"/><circle cx="350" cy="245" r="12" fill="%232f1e0d"/><circle cx="620" cy="245" r="12" fill="%232f1e0d"/><text x="50" y="560" font-family="Segoe UI" font-size="48" fill="%23333030">야생쌍봉낙타</text></svg>',
                description: '야생쌍봉낙타는 중앙아시아 고비 사막에 사는 희귀한 낙타입니다. 가축화된 낙타와 달리 더 빠르고 민첩하며 개체 수가 매우 적어 보호 대상입니다.'
            }
        ];

        const stageInfo = [
            {
                title: '리듬 챌린지',
                instruction: '화면 아래 4개 레인을 터치해서 떨어지는 노트를 판정하세요.',
                gameId: 'rhythmGame'
            },
            {
                title: '카드 기억 챌린지',
                instruction: '16장 카드를 뒤집어 같은 그림 8쌍을 모두 찾아보세요.',
                gameId: 'memoryGame'
            },
            {
                title: '순서 기억 챌린지',
                instruction: '화면에 빛나는 순서를 기억하고 같은 순서대로 터치하세요.',
                gameId: 'sequenceGame'
            }
        ];

        let currentStage = null;
        let currentGameId = null;
        let resultSuccess = false;

        function goHome() {
            stopAllGames();
            document.getElementById('detailPage').classList.add('hidden');
            document.getElementById('gamePage').classList.add('hidden');
            document.getElementById('mainPage').classList.remove('hidden');
            hideResult();
        }

        function startStage(index) {
            currentStage = index;
            currentGameId = stageInfo[index].gameId;
            resultSuccess = false;
            document.getElementById('mainPage').classList.add('hidden');
            document.getElementById('detailPage').classList.add('hidden');
            document.getElementById('gamePage').classList.remove('hidden');
            document.getElementById('gameTitle').textContent = `${speciesData[index].name} ${stageInfo[index].title}`;
            document.getElementById('gameInstruction').textContent = stageInfo[index].instruction;
            document.querySelectorAll('.game-screen').forEach(el => el.classList.add('hidden'));
            document.getElementById(currentGameId).classList.remove('hidden');
            hideResult();
            if (currentGameId === 'rhythmGame') initRhythmGame();
            if (currentGameId === 'memoryGame') initMemoryGame();
            if (currentGameId === 'sequenceGame') initSequenceGame();
        }

        function hideResult() {
            document.getElementById('gameResult').classList.add('hidden');
            document.getElementById('resultProceedBtn').classList.add('hidden');
        }

        function showSpeciesDetail() {
            if (!resultSuccess) return;
            const species = speciesData[currentStage];
            document.getElementById('speciesName').textContent = species.name;
            document.getElementById('speciesImage').src = species.image;
            document.getElementById('speciesDescription').textContent = species.description;
            document.getElementById('gamePage').classList.add('hidden');
            document.getElementById('detailPage').classList.remove('hidden');
        }

        // ===== 리듬 게임 =====
        const rhythmState = {
            active: false,
            score: 0,
            combo: 0,
            hits: 0,
            timeLeft: 60,
            notes: [],
            nextSpawn: 0,
            startTime: 0,
            animationId: null,
            feedbackTimer: null
        };

        const rhythmContainer = document.getElementById('rhythmContainer');
        const noteLayer = document.getElementById('noteLayer');
        const laneButtons = document.querySelectorAll('.lane-button');

        function initRhythmGame() {
            stopAllGames();
            rhythmState.score = 0;
            rhythmState.combo = 0;
            rhythmState.hits = 0;
            rhythmState.timeLeft = 60;
            rhythmState.notes = [];
            rhythmState.nextSpawn = 0;
            rhythmState.active = true;
            rhythmState.startTime = performance.now();
            updateRhythmUI();
            noteLayer.innerHTML = '';
            rhythmState.animationId = requestAnimationFrame(rhythmTick);
        }

        function rhythmTick(now) {
            if (!rhythmState.active) return;
            const elapsed = now - rhythmState.startTime;
            const total = 60000;
            const remain = Math.max(0, total - elapsed);
            rhythmState.timeLeft = Math.ceil(remain / 1000);
            updateRhythmUI();

            while (elapsed >= rhythmState.nextSpawn) {
                spawnRhythmNote(rhythmState.nextSpawn);
                rhythmState.nextSpawn += 850;
            }

            const containerHeight = rhythmContainer.clientHeight;
            const judgeY = containerHeight - 92;
            rhythmState.notes.forEach(note => {
                note.progress = (elapsed - note.spawnTime) * 0.24;
                note.element.style.transform = `translate(${note.left}px, ${note.progress}px)`;
                if (!note.hit && note.progress > containerHeight + 20) {
                    note.hit = true;
                    handleRhythmResult('miss');
                }
            });

            rhythmState.notes = rhythmState.notes.filter(note => !note.hit || note.progress < containerHeight + 80);

            if (remain <= 0) {
                rhythmState.active = false;
                finishRhythmGame();
                return;
            }
            rhythmState.animationId = requestAnimationFrame(rhythmTick);
        }

        function spawnRhythmNote(spawnTime) {
            const lane = Math.floor(Math.random() * 4);
            const noteEl = document.createElement('div');
            noteEl.className = 'note';
            noteEl.textContent = '♪';
            noteEl.style.left = `calc(${lane * 25}% + ${8 + lane * 8}px)`;
            noteLayer.appendChild(noteEl);
            rhythmState.notes.push({ lane, spawnTime, element: noteEl, left: lane * (rhythmContainer.clientWidth / 4) + lane * 8, hit: false, progress: -60 });
        }

        function updateRhythmUI() {
            document.getElementById('rhythmTime').textContent = rhythmState.timeLeft;
            document.getElementById('rhythmScore').textContent = rhythmState.score;
            document.getElementById('rhythmCombo').textContent = rhythmState.combo;
            document.getElementById('rhythmHits').textContent = rhythmState.hits;
        }

        function handleRhythmTouch(index) {
            if (!rhythmState.active) return;
            const judgeY = rhythmContainer.clientHeight - 90;
            let bestNote = null;
            let bestDistance = Infinity;
            rhythmState.notes.forEach(note => {
                if (note.lane !== index || note.hit) return;
                const noteCenter = note.progress + 24;
                const distance = Math.abs(noteCenter - judgeY);
                if (distance < bestDistance) {
                    bestDistance = distance;
                    bestNote = note;
                }
            });
            if (bestNote && bestDistance <= 80) {
                bestNote.hit = true;
                bestNote.element.remove();
                rhythmState.hits += 1;
                if (bestDistance <= 28) {
                    rhythmState.score += 230;
                    rhythmState.combo += 1;
                    showRhythmFeedback('Perfect', 'perfect');
                } else {
                    rhythmState.score += 110;
                    rhythmState.combo += 1;
                    showRhythmFeedback('Good', 'good');
                }
                rhythmState.score = Math.max(0, rhythmState.score);
            } else {
                rhythmState.combo = 0;
                showRhythmFeedback('Miss', 'miss');
            }
            updateRhythmUI();
        }

        function showRhythmFeedback(text, type) {
            const feedback = document.getElementById('rhythmFeedback');
            feedback.textContent = text;
            feedback.className = `feedback ${type}`;
            clearTimeout(rhythmState.feedbackTimer);
            rhythmState.feedbackTimer = setTimeout(() => {
                feedback.textContent = '';
                feedback.className = 'feedback';
            }, 500);
        }

        function finishRhythmGame() {
            const score = rhythmState.score;
            const success = score >= 1000;
            resultSuccess = success;
            const rank = score >= 1600 ? 'S' : score >= 1200 ? 'A' : score >= 900 ? 'B' : 'C';
            document.getElementById('resultTitle').textContent = success ? '리듬 챌리어!' : '다시 도전해보세요';
            document.getElementById('resultDetail').textContent = `점수 ${score} · ${rank} · ${success ? '성공하면 종 설명을 확인할 수 있습니다.' : '점수를 올려서 다시 도전하세요.'}`;
            showResultButtons(success);
        }

        laneButtons.forEach(button => {
            button.addEventListener('pointerdown', event => {
                const index = parseInt(button.dataset.lane, 10);
                button.classList.add('active');
                handleRhythmTouch(index);
            });
            button.addEventListener('pointerup', () => button.classList.remove('active'));
            button.addEventListener('touchcancel', () => button.classList.remove('active'));
        });

        // ===== 카드 게임 =====
        const memoryState = {
            cards: [],
            first: null,
            second: null,
            matched: 0,
            attempts: 0,
            seconds: 0,
            timerId: null,
            busy: false
        };

        function initMemoryGame() {
            stopAllGames();
            memoryState.cards = shuffle([...['🐾','🌵','🐪','🌙','🌟','🍃','🪨','🌻','🐾','🌵','🐪','🌙','🌟','🍃','🪨','🌻']]);
            memoryState.first = null;
            memoryState.second = null;
            memoryState.matched = 0;
            memoryState.attempts = 0;
            memoryState.seconds = 0;
            memoryState.busy = false;
            clearInterval(memoryState.timerId);
            document.getElementById('memoryTime').textContent = '00:00';
            document.getElementById('memoryAttempts').textContent = '0';
            document.getElementById('memoryMatches').textContent = '0';
            document.getElementById('memoryRank').textContent = '-';
            document.getElementById('cardGrid').innerHTML = '';

            memoryState.cards.forEach((symbol, idx) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = idx;
                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-face card-front"></div>
                        <div class="card-face card-back">${symbol}</div>
                    </div>`;
                card.addEventListener('pointerdown', event => {
                    event.preventDefault();
                    flipMemoryCard(card, idx);
                });
                document.getElementById('cardGrid').appendChild(card);
            });
        }

        function flipMemoryCard(card, index) {
            if (memoryState.busy) return;
            const symbol = memoryState.cards[index];
            if (card.classList.contains('flipped')) return;
            if (!memoryState.timerId) {
                memoryState.timerId = setInterval(() => {
                    memoryState.seconds += 1;
                    document.getElementById('memoryTime').textContent = formatTime(memoryState.seconds);
                }, 1000);
            }
            card.classList.add('flipped');
            if (!memoryState.first) {
                memoryState.first = { card, symbol, index };
                return;
            }
            if (memoryState.first.index === index) return;
            memoryState.second = { card, symbol, index };
            memoryState.attempts += 1;
            document.getElementById('memoryAttempts').textContent = memoryState.attempts;
            if (memoryState.first.symbol === memoryState.second.symbol) {
                memoryState.matched += 1;
                document.getElementById('memoryMatches').textContent = memoryState.matched;
                memoryState.first = null;
                memoryState.second = null;
                if (memoryState.matched === 8) finishMemoryGame();
            } else {
                memoryState.busy = true;
                setTimeout(() => {
                    memoryState.first.card.classList.remove('flipped');
                    memoryState.second.card.classList.remove('flipped');
                    memoryState.first = null;
                    memoryState.second = null;
                    memoryState.busy = false;
                }, 1000);
            }
            document.getElementById('memoryRank').textContent = computeMemoryRank();
        }

        function finishMemoryGame() {
            clearInterval(memoryState.timerId);
            const rank = computeMemoryRank();
            resultSuccess = true;
            document.getElementById('resultTitle').textContent = '기억력 클리어!';
            document.getElementById('resultDetail').textContent = `시간 ${formatTime(memoryState.seconds)} · 시도 ${memoryState.attempts} · 랭크 ${rank}`;
            showResultButtons(true);
        }

        function computeMemoryRank() {
            if (memoryState.seconds <= 40 && memoryState.attempts <= 24) return 'S';
            if (memoryState.seconds <= 55 && memoryState.attempts <= 30) return 'A';
            if (memoryState.seconds <= 70 && memoryState.attempts <= 36) return 'B';
            return 'C';
        }

        function formatTime(sec) {
            const m = String(Math.floor(sec / 60)).padStart(2, '0');
            const s = String(sec % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i -= 1) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // ===== 순서 기억 게임 =====
        const sequenceState = {
            sequence: [],
            playerStep: 0,
            round: 0,
            best: Number(localStorage.getItem('bestSequenceRound') || '0'),
            accepting: false,
            timeoutId: null,
            highlightId: null
        };

        const sequenceButtons = document.querySelectorAll('.color-btn');

        function initSequenceGame() {
            stopAllGames();
            sequenceState.sequence = [];
            sequenceState.playerStep = 0;
            sequenceState.round = 0;
            sequenceState.accepting = false;
            document.getElementById('sequenceBest').textContent = sequenceState.best;
            document.getElementById('sequenceRound').textContent = 0;
            document.getElementById('sequenceMessage').textContent = '시작 버튼을 눌러 순서를 확인하세요.';
            sequenceButtons.forEach(btn => btn.classList.remove('active'));
        }

        function startSequence() {
            if (sequenceState.accepting) return;
            sequenceState.round += 1;
            sequenceState.playerStep = 0;
            sequenceState.sequence.push(Math.floor(Math.random() * 4));
            document.getElementById('sequenceRound').textContent = sequenceState.round;
            document.getElementById('sequenceMessage').textContent = '순서를 기억하세요.';
            playSequence();
        }

        function playSequence() {
            sequenceState.accepting = false;
            const delay = Math.max(420, 830 - sequenceState.round * 35);
            sequenceState.sequence.forEach((index, step) => {
                setTimeout(() => highlightButton(index), step * delay);
            });
            setTimeout(() => {
                sequenceState.accepting = true;
                document.getElementById('sequenceMessage').textContent = '같은 순서대로 터치하세요.';
            }, sequenceState.sequence.length * delay);
        }

        function highlightButton(index) {
            const button = sequenceButtons[index];
            button.classList.add('active');
            setTimeout(() => button.classList.remove('active'), 320);
        }

        sequenceButtons.forEach(button => {
            button.addEventListener('pointerdown', event => {
                event.preventDefault();
                const idx = parseInt(button.dataset.index, 10);
                if (!sequenceState.accepting) return;
                button.classList.add('active');
                handleSequenceInput(idx);
            });
            button.addEventListener('pointerup', () => button.classList.remove('active'));
            button.addEventListener('touchcancel', () => button.classList.remove('active'));
        });

        function handleSequenceInput(index) {
            if (!sequenceState.accepting) return;
            if (index !== sequenceState.sequence[sequenceState.playerStep]) {
                gameOverSequence(false);
                return;
            }
            sequenceState.playerStep += 1;
            if (sequenceState.playerStep === sequenceState.sequence.length) {
                sequenceState.accepting = false;
                if (sequenceState.round >= 10) {
                    gameOverSequence(true);
                } else {
                    document.getElementById('sequenceMessage').textContent = '다음 라운드를 준비합니다.';
                    setTimeout(startSequence, 900);
                }
            }
        }

        function gameOverSequence(success) {
            sequenceState.accepting = false;
            sequenceState.best = Math.max(sequenceState.best, sequenceState.round);
            localStorage.setItem('bestSequenceRound', sequenceState.best);
            document.getElementById('sequenceBest').textContent = sequenceState.best;
            if (success) {
                resultSuccess = true;
                document.getElementById('resultTitle').textContent = '순서 기억 클리어!';
                document.getElementById('resultDetail').textContent = `라운드 ${sequenceState.round} · 최고 ${sequenceState.best} · 성공했습니다.`;
                showResultButtons(true);
            } else {
                resultSuccess = false;
                document.getElementById('resultTitle').textContent = '게임 오버';
                document.getElementById('resultDetail').textContent = `라운드 ${sequenceState.round}에서 틀렸습니다. 최고 ${sequenceState.best}를 기록했습니다.`;
                showResultButtons(false);
            }
        }

        function showResultButtons(success) {
            document.getElementById('gameResult').classList.remove('hidden');
            const proceedBtn = document.getElementById('resultProceedBtn');
            if (success) {
                proceedBtn.classList.remove('hidden');
            } else {
                proceedBtn.classList.add('hidden');
            }
        }

        function restartCurrentGame() {
            if (currentGameId === 'rhythmGame') initRhythmGame();
            if (currentGameId === 'memoryGame') initMemoryGame();
            if (currentGameId === 'sequenceGame') initSequenceGame();
            hideResult();
        }

        function stopAllGames() {
            rhythmState.active = false;
            if (rhythmState.animationId) cancelAnimationFrame(rhythmState.animationId);
            clearTimeout(rhythmState.feedbackTimer);
            clearInterval(memoryState.timerId);
            clearTimeout(sequenceState.timeoutId);
            clearTimeout(sequenceState.highlightId);
            sequenceState.accepting = false;
        }

        document.addEventListener('touchmove', event => {
            event.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
